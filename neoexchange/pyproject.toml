[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["core/**/migrations/*.py", ]

[tool.ruff.lint]
# ruff >= 0.16 enables the pyupgrade (UP) family by default. The codebase still uses
# '%' and .format() string formatting throughout and will for some time, so silence
# the "rewrite as f-string" style of nag. Add further codes here to quiet other rules.
ignore = [
    "UP025",   # u'' string prefix
    "UP030",   # explicit positional indices in .format()
    "UP031",   # '%' formatting -> .format()/f-string
    "UP032",   # .format() -> f-string
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
